<!--
    ABELIAN SANDPILE SIMULATION (GPU-ACCELERATED)
    ==============================================
    Classic self-organized criticality model. Drop sand grains on a grid; when a cell
    reaches threshold (4), it topples and distributes grains to neighbors. Avalanche
    sizes follow a power law distribution.

    Key Features:
    - WebGL GPU rendering for smooth visualization of large grids (up to 600x600)
    - Real-time avalanche size distribution in log-log plot
    - Adjustable parameters: grid size, drop speed, drop mode (center vs random)
    - Color-coded visualization showing grain count per cell
    - Manual grain dropping for experimentation

    Physics:
    - Abelian group property: order of grain drops doesn't affect final state
    - Self-organized criticality: system evolves to critical state without tuning
    - Power law: P(avalanche size = s) ~ s^(-τ) with τ ≈ 1.27 (2D)
    - Scale invariance: avalanches occur at all scales
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandpile (GPU)</title>
    <style>
        /* ===== GLOBAL & LAYOUT STYLES ===== */
        /* Dark theme with sand/earth color scheme */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: #f4a261; }
        .subtitle { color: #888; margin-bottom: 20px; text-align: center; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { border: 2px solid #333; }
        .panel { display: flex; flex-direction: column; align-items: center; }
        .panel-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .controls { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        label { font-size: 12px; color: #888; }
        input[type="range"] { width: 120px; }
        button { background: #f4a261; color: #1a1a2e; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background: #f4b982; }
        .stats { margin-top: 15px; font-size: 14px; color: #aaa; }
        .legend { display: flex; gap: 10px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .legend-color { width: 16px; height: 16px; border-radius: 3px; }
        .gpu-badge { background: #4CAF50; color: white; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-left: 10px; }
    </style>
</head>
<body>
    <!-- ===== PAGE HEADER ===== -->
    <h1>Sandpile Avalanche <span class="gpu-badge">WebGL GPU</span></h1>
    <p class="subtitle">Abelian Sandpile Model - Self-Organized Criticality<br>Cells topple at 4 grains, distributing to neighbors</p>

    <!-- ===== VISUALIZATION CONTAINERS ===== -->
    <!-- Left: Sandpile grid (WebGL), Right: Avalanche distribution (2D canvas) -->
    <div class="container">
        <div class="panel">
            <canvas id="glCanvas"></canvas>
            <!-- Color legend showing grain counts (0-4+) -->
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: #2d1f0f;"></div>0</div>
                <div class="legend-item"><div class="legend-color" style="background: #5c3d1e;"></div>1</div>
                <div class="legend-item"><div class="legend-color" style="background: #8b5a2b;"></div>2</div>
                <div class="legend-item"><div class="legend-color" style="background: #d4a574;"></div>3</div>
                <div class="legend-item"><div class="legend-color" style="background: #ff6b6b;"></div>4+</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">Avalanche Size Distribution (log-log)</div>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <div class="stats">
        Grains: <span id="grains">0</span> |
        Avalanches: <span id="avalanches">0</span> |
        Largest: <span id="largest">0</span> |
        Current: <span id="current">0</span> |
        FPS: <span id="fps">0</span>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Speed: <span id="speedVal">60</span>/sec</label>
            <input type="range" id="speed" min="1" max="1000" value="60">
        </div>
        <div class="control-group">
            <label>Grid: <span id="sizeVal">300</span></label>
            <input type="range" id="size" min="100" max="600" step="50" value="300">
        </div>
        <div class="control-group">
            <label>Drop Mode</label>
            <select id="dropMode">
                <option value="center">Center</option>
                <option value="random" selected>Random</option>
            </select>
        </div>
        <button id="drop100">Drop 100</button>
        <button id="reset">Reset</button>
        <button id="pause">Start</button>
    </div>

    <script>
        // ===== WEBGL SETUP =====
        // GPU rendering for fast visualization of large sandpile grids
        const glCanvas = document.getElementById('glCanvas');
        let GRID_SIZE = 300;
        glCanvas.width = 500;
        glCanvas.height = 500;
        const gl = glCanvas.getContext('webgl');

        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');
        chartCanvas.width = 350;
        chartCanvas.height = 300;

        // ===== WEBGL SHADERS =====
        // Render each cell as a colored point based on grain count (0-4+)
        const vsSource = `
            attribute vec2 a_position;      // Cell position in grid
            attribute float a_grains;        // Number of grains (0-4+)
            uniform vec2 u_resolution;       // Canvas dimensions
            varying float v_grains;          // Pass to fragment shader
            void main() {
                vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;
                gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
                gl_PointSize = max(1.0, u_resolution.x / 300.0);  // Scale point size with grid
                v_grains = a_grains;
            }
        `;
        const fsSource = `
            precision mediump float;
            varying float v_grains;
            void main() {
                // Color gradient: dark brown (0) → light tan (3) → red (4+)
                vec3 color;
                if (v_grains < 0.5) color = vec3(0.18, 0.12, 0.06);
                else if (v_grains < 1.5) color = vec3(0.36, 0.24, 0.12);
                else if (v_grains < 2.5) color = vec3(0.55, 0.35, 0.17);
                else if (v_grains < 3.5) color = vec3(0.83, 0.65, 0.46);
                else color = vec3(1.0, 0.42, 0.42);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'a_position');
        const grainsLoc = gl.getAttribLocation(program, 'a_grains');
        const resLoc = gl.getUniformLocation(program, 'u_resolution');

        const posBuf = gl.createBuffer();
        const grainsBuf = gl.createBuffer();

        // ===== SIMULATION STATE =====
        // Grid: Uint8Array of grain counts
        // Avalanche tracking: sizes, current size, toppling state
        let grid, positions, grainsFloat;
        let totalGrains = 0;
        let avalancheSizes = [];
        let currentAvalanche = 0;
        let largestAvalanche = 0;
        let isToppling = false;
        let paused = true;
        let stepsPerSecond = 60;
        let dropMode = 'random';  // 'random' or 'center'
        let lastFpsTime = 0, frameCount = 0, fps = 0;

        // ===== INITIALIZATION =====
        // Start with empty grid
        function initGrid() {
            const n = GRID_SIZE * GRID_SIZE;
            grid = new Uint8Array(n);
            positions = new Float32Array(n * 2);
            grainsFloat = new Float32Array(n);

            // Precompute positions for WebGL (scaled to 500x500 canvas)
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const idx = i * GRID_SIZE + j;
                    positions[idx * 2] = (j + 0.5) * (500 / GRID_SIZE);
                    positions[idx * 2 + 1] = (i + 0.5) * (500 / GRID_SIZE);
                    grid[idx] = 0;
                    grainsFloat[idx] = 0;
                }
            }
            totalGrains = 0;
            avalancheSizes = [];
            currentAvalanche = 0;
            largestAvalanche = 0;
            isToppling = false;
        }

        // ===== SIMULATION LOGIC =====
        // Drop a single grain at center or random location
        function dropGrain() {
            let i, j;
            if (dropMode === 'center') {  // Central pile creates fractal patterns
                i = Math.floor(GRID_SIZE / 2);
                j = Math.floor(GRID_SIZE / 2);
            } else {  // Random drops create steady-state critical behavior
                i = Math.floor(Math.random() * GRID_SIZE);
                j = Math.floor(Math.random() * GRID_SIZE);
            }
            const idx = i * GRID_SIZE + j;
            grid[idx]++;
            totalGrains++;
        }

        // Toppling step: cells with ≥4 grains distribute to 4 neighbors
        // Returns true if any cells toppled
        function toppleStep() {
            // Find all cells that need to topple
            const toTopple = [];
            for (let idx = 0; idx < grid.length; idx++) {
                if (grid[idx] >= 4) toTopple.push(idx);  // Threshold = 4
            }

            if (toTopple.length === 0) return false;  // Avalanche ended

            // Simultaneous toppling (Abelian property)
            for (const idx of toTopple) {
                const i = Math.floor(idx / GRID_SIZE);
                const j = idx % GRID_SIZE;
                grid[idx] -= 4;  // Lose 4 grains
                currentAvalanche++;  // Count toppling event

                // Distribute 1 grain to each of 4 neighbors (if they exist)
                if (i > 0) grid[(i-1) * GRID_SIZE + j]++;
                if (i < GRID_SIZE - 1) grid[(i+1) * GRID_SIZE + j]++;
                if (j > 0) grid[i * GRID_SIZE + (j-1)]++;
                if (j < GRID_SIZE - 1) grid[i * GRID_SIZE + (j+1)]++;
            }
            return true;  // More toppling may be needed
        }

        // Check if any cell needs toppling
        function needsToppling() {
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] >= 4) return true;
            }
            return false;
        }

        // Main simulation step: either propagate avalanche or drop new grain
        function simulationStep() {
            if (isToppling) {  // Avalanche in progress
                if (!toppleStep()) {  // Avalanche finished
                    isToppling = false;
                    if (currentAvalanche > 0) {  // Record avalanche size
                        avalancheSizes.push(currentAvalanche);
                        if (currentAvalanche > largestAvalanche) largestAvalanche = currentAvalanche;
                    }
                    currentAvalanche = 0;
                }
            } else {  // No avalanche: drop new grain
                dropGrain();
                if (needsToppling()) {
                    isToppling = true;
                }
            }
            // Sync float array for GPU upload
            for (let i = 0; i < grid.length; i++) grainsFloat[i] = grid[i];
        }

        function render() {
            gl.viewport(0, 0, glCanvas.width, glCanvas.height);
            gl.clearColor(0.04, 0.04, 0.08, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, grainsBuf);
            gl.bufferData(gl.ARRAY_BUFFER, grainsFloat, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(grainsLoc);
            gl.vertexAttribPointer(grainsLoc, 1, gl.FLOAT, false, 0, 0);

            gl.uniform2f(resLoc, glCanvas.width, glCanvas.height);
            gl.drawArrays(gl.POINTS, 0, GRID_SIZE * GRID_SIZE);
        }

        // Draw log-log plot of avalanche size distribution (power law check)
        function renderChart() {
            const W = chartCanvas.width, H = chartCanvas.height;
            chartCtx.fillStyle = '#0a0a15';
            chartCtx.fillRect(0, 0, W, H);

            if (avalancheSizes.length < 10) {
                chartCtx.fillStyle = '#666';
                chartCtx.font = '14px sans-serif';
                chartCtx.textAlign = 'center';
                chartCtx.fillText('Collecting avalanche data...', W/2, H/2);
                return;
            }

            // Bin avalanche sizes and count frequencies
            const counts = {};
            for (const s of avalancheSizes) counts[s] = (counts[s] || 0) + 1;
            const sizes = Object.keys(counts).map(Number).sort((a,b) => a-b);
            const freqs = sizes.map(s => counts[s]);

            const pad = 50;
            const cw = W - 2*pad, ch = H - 2*pad;
            // Log-log scale for power law visualization
            const logMinS = Math.log10(Math.max(1, sizes[0]));
            const logMaxS = Math.log10(sizes[sizes.length-1]);
            const logMinF = Math.log10(Math.max(1, Math.min(...freqs)));
            const logMaxF = Math.log10(Math.max(...freqs));

            chartCtx.strokeStyle = '#444';
            chartCtx.beginPath();
            chartCtx.moveTo(pad, pad);
            chartCtx.lineTo(pad, H-pad);
            chartCtx.lineTo(W-pad, H-pad);
            chartCtx.stroke();

            chartCtx.fillStyle = '#f4a261';
            for (let i = 0; i < sizes.length; i++) {
                const lx = (Math.log10(sizes[i]) - logMinS) / (logMaxS - logMinS || 1);
                const ly = (Math.log10(freqs[i]) - logMinF) / (logMaxF - logMinF || 1);
                const x = pad + lx * cw;
                const y = H - pad - ly * ch;
                chartCtx.beginPath();
                chartCtx.arc(x, y, 3, 0, Math.PI*2);
                chartCtx.fill();
            }

            chartCtx.fillStyle = '#888';
            chartCtx.font = '12px sans-serif';
            chartCtx.textAlign = 'center';
            chartCtx.fillText('Avalanche Size (log)', W/2, H-10);
        }

        function updateStats() {
            document.getElementById('grains').textContent = totalGrains;
            document.getElementById('avalanches').textContent = avalancheSizes.length;
            document.getElementById('largest').textContent = largestAvalanche;
            document.getElementById('current').textContent = currentAvalanche;
            document.getElementById('fps').textContent = fps;
        }

        // ===== ANIMATION LOOP =====
        function animate(ts) {
            frameCount++;
            if (ts - lastFpsTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsTime = ts;
            }
            if (!paused) {
                const spf = Math.max(1, Math.floor(stepsPerSecond / 60));  // Steps per frame
                for (let i = 0; i < spf; i++) simulationStep();
                render();
                if (avalancheSizes.length % 20 === 0) renderChart();
                updateStats();
            }
            requestAnimationFrame(animate);
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('speed').addEventListener('input', e => {
            stepsPerSecond = parseInt(e.target.value);
            document.getElementById('speedVal').textContent = stepsPerSecond;
        });
        document.getElementById('size').addEventListener('input', e => {
            GRID_SIZE = parseInt(e.target.value);
            document.getElementById('sizeVal').textContent = GRID_SIZE;
            initGrid();
            render();
        });
        // Switch between center and random drop modes
        document.getElementById('dropMode').addEventListener('change', e => {
            dropMode = e.target.value;
        });
        // Manual bulk grain drop
        document.getElementById('drop100').addEventListener('click', () => {
            for (let i = 0; i < 100; i++) dropGrain();
            for (let i = 0; i < grid.length; i++) grainsFloat[i] = grid[i];
            render();
            updateStats();
        });
        document.getElementById('reset').addEventListener('click', () => {
            initGrid();
            render();
            renderChart();
            updateStats();
        });
        document.getElementById('pause').addEventListener('click', e => {
            paused = !paused;
            e.target.textContent = paused ? 'Start' : 'Pause';
        });

        // ===== INITIALIZATION =====
        initGrid();
        render();
        updateStats();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
