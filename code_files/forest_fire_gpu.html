<!--
    FOREST FIRE SIMULATION (GPU-ACCELERATED)
    =========================================
    Demonstrates self-organized criticality using the Drossel-Schwabl forest fire model.
    Trees grow spontaneously, lightning strikes cause fires, and fires spread to adjacent
    trees. At critical parameters, fire size distribution follows a power law.

    Key Features:
    - WebGL GPU rendering for smooth visualization of large grids (up to 800x800)
    - Real-time fire size distribution in log-log plot showing power law behavior
    - Adjustable parameters: tree growth rate, lightning probability, grid size
    - Manual lightning strike button for experimentation

    Physics:
    - Self-organized criticality: system naturally evolves to critical state
    - Power law distribution: P(fire size = s) ~ s^(-α) for some α
    - Phase transition behavior similar to percolation theory
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire (GPU)</title>
    <style>
        /* ===== GLOBAL STYLES ===== */
        /* Dark theme for better contrast with simulation colors */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HEADER STYLES ===== */
        h1 { margin-bottom: 10px; color: #ff6b35; }  /* Orange-red to match fire theme */
        .subtitle { color: #888; margin-bottom: 20px; }

        /* ===== LAYOUT STYLES ===== */
        /* Side-by-side layout for grid visualization and distribution chart */
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { border: 2px solid #333; }
        .panel { display: flex; flex-direction: column; align-items: center; }
        .panel-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }

        /* ===== CONTROL PANEL STYLES ===== */
        /* Flexible wrapping layout for responsive design */
        .controls { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        label { font-size: 12px; color: #888; }
        input[type="range"] { width: 120px; }

        /* Fire-themed orange buttons with hover effect */
        button { background: #ff6b35; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: #ff8c5a; }

        /* ===== STATISTICS AND LEGEND STYLES ===== */
        .stats { margin-top: 15px; font-size: 14px; color: #aaa; }
        .legend { display: flex; gap: 15px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .legend-color { width: 16px; height: 16px; border-radius: 3px; }

        /* Green badge to indicate GPU acceleration */
        .gpu-badge { background: #4CAF50; color: white; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-left: 10px; }
    </style>
</head>
<body>
    <!-- ===== PAGE HEADER ===== -->
    <h1>Forest Fire Simulation <span class="gpu-badge">WebGL GPU</span></h1>
    <p class="subtitle">Self-Organized Criticality - Drossel-Schwabl Model</p>

    <!-- ===== VISUALIZATION CONTAINERS ===== -->
    <!-- Left: WebGL canvas for grid, Right: 2D canvas for log-log distribution -->
    <div class="container">
        <div class="panel">
            <canvas id="glCanvas"></canvas>
            <!-- Color legend showing cell states -->
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: #1a1a1a;"></div>Empty</div>
                <div class="legend-item"><div class="legend-color" style="background: #228b22;"></div>Tree</div>
                <div class="legend-item"><div class="legend-color" style="background: #ff4500;"></div>Burning</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">Fire Size Distribution (log-log)</div>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <!-- ===== STATISTICS DISPLAY ===== -->
    <!-- Real-time stats: steps, tree count, density, fires, FPS -->
    <div class="stats">
        Step: <span id="step">0</span> |
        Trees: <span id="trees">0</span> |
        Density: <span id="density">0</span>% |
        Fires: <span id="fires">0</span> |
        Largest: <span id="largest">0</span> |
        FPS: <span id="fps">0</span>
    </div>

    <!-- ===== CONTROL PANEL ===== -->
    <!-- Sliders for speed, grid size, tree growth, lightning probability -->
    <div class="controls">
        <div class="control-group">
            <label>Speed: <span id="speedVal">60</span>/sec</label>
            <input type="range" id="speed" min="1" max="500" value="60">
        </div>
        <div class="control-group">
            <label>Grid: <span id="sizeVal">400</span></label>
            <input type="range" id="size" min="100" max="800" step="50" value="400">
        </div>
        <div class="control-group">
            <label>Tree Growth: <span id="growthVal">1</span>%</label>
            <input type="range" id="growth" min="1" max="10" value="1">
        </div>
        <div class="control-group">
            <label>Lightning: <span id="lightningVal">0.01</span>%</label>
            <input type="range" id="lightning" min="1" max="100" value="10">
        </div>
        <button id="strike">Lightning Strike</button>
        <button id="reset">Reset</button>
        <button id="pause">Start</button>
    </div>

    <script>
        // ===== SIMULATION CONSTANTS =====
        // Three cell states: 0=empty (black), 1=tree (green), 2=burning (red)
        const EMPTY = 0, TREE = 1, BURNING = 2;

        // ===== WEBGL SETUP =====
        // GPU-accelerated rendering for smooth visualization of large grids
        const glCanvas = document.getElementById('glCanvas');
        let GRID_SIZE = 400;
        glCanvas.width = GRID_SIZE;
        glCanvas.height = GRID_SIZE;
        const gl = glCanvas.getContext('webgl');

        // Separate 2D canvas for log-log distribution chart
        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');
        chartCanvas.width = 350;
        chartCanvas.height = 300;

        // ===== WEBGL SHADERS =====
        // Vertex shader: transforms grid positions to clip space
        // Fragment shader: colors cells based on state (empty/tree/burning)
        const vsSource = `
            attribute vec2 a_position;      // Cell position in grid coordinates
            attribute float a_state;         // Cell state (0, 1, or 2)
            uniform vec2 u_resolution;       // Grid dimensions
            varying float v_state;           // Pass state to fragment shader
            void main() {
                vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;  // Convert to clip space [-1, 1]
                gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);         // Flip Y-axis
                gl_PointSize = 1.0;  // Each cell is 1 pixel
                v_state = a_state;
            }
        `;
        const fsSource = `
            precision mediump float;
            varying float v_state;  // Received from vertex shader
            void main() {
                vec3 color;
                if (v_state < 0.5) color = vec3(0.1, 0.1, 0.1);         // EMPTY: dark gray
                else if (v_state < 1.5) color = vec3(0.13, 0.55, 0.13); // TREE: forest green
                else color = vec3(1.0, 0.27, 0.0);                       // BURNING: orange-red
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Helper function to compile GLSL shaders
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        // Compile and link shader program
        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        // Get attribute and uniform locations for data upload
        const posLoc = gl.getAttribLocation(program, 'a_position');
        const stateLoc = gl.getAttribLocation(program, 'a_state');
        const resLoc = gl.getUniformLocation(program, 'u_resolution');

        // Create GPU buffers for position and state data
        const posBuf = gl.createBuffer();
        const stateBuf = gl.createBuffer();

        // ===== SIMULATION STATE =====
        // Grid: Uint8Array for memory efficiency
        // Positions: pre-computed pixel coordinates for WebGL
        // States: float array for GPU upload
        let grid, positions, states;
        let step = 0;
        let fireSizes = [];
        let largestFire = 0;
        let currentFireSize = 0;
        let paused = true;
        let stepsPerSecond = 60;
        let treeGrowth = 0.01;       // Probability per cell per step: 1%
        let lightning = 0.0001;       // Probability per tree per step: 0.01%
        let lastFpsTime = 0, frameCount = 0, fps = 0;

        // ===== INITIALIZATION =====
        // Create grid with random 50% tree density
        function initGrid() {
            const n = GRID_SIZE * GRID_SIZE;
            grid = new Uint8Array(n);
            positions = new Float32Array(n * 2);
            states = new Float32Array(n);

            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const idx = i * GRID_SIZE + j;
                    positions[idx * 2] = j + 0.5;
                    positions[idx * 2 + 1] = i + 0.5;
                    grid[idx] = Math.random() < 0.5 ? TREE : EMPTY;
                    states[idx] = grid[idx];
                }
            }
            step = 0;
            fireSizes = [];
            largestFire = 0;
            currentFireSize = 0;
        }

        // ===== SIMULATION LOGIC =====
        // Get 8 neighbors (Moore neighborhood) with boundary checking
        function getNeighbors(idx) {
            const i = Math.floor(idx / GRID_SIZE);
            const j = idx % GRID_SIZE;
            const neighbors = [];
            for (let di = -1; di <= 1; di++) {
                for (let dj = -1; dj <= 1; dj++) {
                    if (di === 0 && dj === 0) continue;
                    const ni = i + di, nj = j + dj;
                    if (ni >= 0 && ni < GRID_SIZE && nj >= 0 && nj < GRID_SIZE) {
                        neighbors.push(ni * GRID_SIZE + nj);
                    }
                }
            }
            return neighbors;
        }

        // Fire spreading: burning cells ignite adjacent trees, then become empty
        // Returns true if fire is still active
        function spreadFireStep() {
            const newBurning = [];
            const toEmpty = [];

            for (let idx = 0; idx < grid.length; idx++) {
                if (grid[idx] === BURNING) {
                    toEmpty.push(idx);
                    for (const nidx of getNeighbors(idx)) {
                        if (grid[nidx] === TREE) {
                            newBurning.push(nidx);
                        }
                    }
                }
            }

            // Update grid: burning → empty, new trees → burning
            for (const idx of toEmpty) grid[idx] = EMPTY;
            for (const idx of newBurning) {
                if (grid[idx] === TREE) {
                    grid[idx] = BURNING;
                    currentFireSize++;
                }
            }

            // Fire ended: record size for power law distribution
            if (newBurning.length === 0 && currentFireSize > 0) {
                fireSizes.push(currentFireSize);
                if (currentFireSize > largestFire) largestFire = currentFireSize;
                currentFireSize = 0;
            }

            return toEmpty.length > 0 || newBurning.length > 0;
        }

        function hasBurning() {
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] === BURNING) return true;
            }
            return false;
        }

        // Main simulation step: either spread existing fire or grow trees & strike lightning
        function simulationStep() {
            if (hasBurning()) {
                spreadFireStep();  // Fire propagates until it burns out
            } else {
                step++;
                // Tree growth: each empty cell has treeGrowth probability
                for (let i = 0; i < grid.length; i++) {
                    if (grid[i] === EMPTY && Math.random() < treeGrowth) {
                        grid[i] = TREE;
                    }
                }
                // Lightning strike: probabilistic based on number of trees
                const trees = [];
                for (let i = 0; i < grid.length; i++) {
                    if (grid[i] === TREE) trees.push(i);
                }
                if (trees.length > 0 && Math.random() < lightning * trees.length) {
                    const idx = trees[Math.floor(Math.random() * trees.length)];
                    grid[idx] = BURNING;
                    currentFireSize = 1;
                }
            }
            // Sync float array with grid for GPU upload
            for (let i = 0; i < grid.length; i++) states[i] = grid[i];
        }

        // Manual lightning strike (for user interaction)
        function lightningStrike() {
            const trees = [];
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] === TREE) trees.push(i);
            }
            if (trees.length > 0) {
                const idx = trees[Math.floor(Math.random() * trees.length)];
                grid[idx] = BURNING;
                currentFireSize = 1;
                for (let i = 0; i < grid.length; i++) states[i] = grid[i];
            }
        }

        // ===== RENDERING =====
        // Upload grid data to GPU and draw as points
        function render() {
            gl.viewport(0, 0, GRID_SIZE, GRID_SIZE);
            gl.clearColor(0.04, 0.04, 0.08, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, stateBuf);
            gl.bufferData(gl.ARRAY_BUFFER, states, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(stateLoc);
            gl.vertexAttribPointer(stateLoc, 1, gl.FLOAT, false, 0, 0);

            gl.uniform2f(resLoc, GRID_SIZE, GRID_SIZE);
            gl.drawArrays(gl.POINTS, 0, GRID_SIZE * GRID_SIZE);
        }

        // Draw log-log plot of fire size distribution (power law check)
        function renderChart() {
            const W = chartCanvas.width, H = chartCanvas.height;
            chartCtx.fillStyle = '#0a0a15';
            chartCtx.fillRect(0, 0, W, H);

            if (fireSizes.length < 5) {
                chartCtx.fillStyle = '#666';
                chartCtx.font = '14px sans-serif';
                chartCtx.textAlign = 'center';
                chartCtx.fillText('Collecting fire data...', W/2, H/2);
                return;
            }

            // Bin fire sizes and count frequencies
            const counts = {};
            for (const s of fireSizes) counts[s] = (counts[s] || 0) + 1;
            const sizes = Object.keys(counts).map(Number).sort((a,b) => a-b);
            const freqs = sizes.map(s => counts[s]);

            const pad = 50;
            const cw = W - 2*pad, ch = H - 2*pad;
            // Log-log scale for power law visualization
            const logMinS = Math.log10(Math.max(1, sizes[0]));
            const logMaxS = Math.log10(sizes[sizes.length-1]);
            const logMinF = Math.log10(Math.max(1, Math.min(...freqs)));
            const logMaxF = Math.log10(Math.max(...freqs));

            chartCtx.strokeStyle = '#444';
            chartCtx.beginPath();
            chartCtx.moveTo(pad, pad);
            chartCtx.lineTo(pad, H-pad);
            chartCtx.lineTo(W-pad, H-pad);
            chartCtx.stroke();

            chartCtx.fillStyle = '#ff6b35';
            for (let i = 0; i < sizes.length; i++) {
                const lx = (Math.log10(sizes[i]) - logMinS) / (logMaxS - logMinS || 1);
                const ly = (Math.log10(freqs[i]) - logMinF) / (logMaxF - logMinF || 1);
                const x = pad + lx * cw;
                const y = H - pad - ly * ch;
                chartCtx.beginPath();
                chartCtx.arc(x, y, 3, 0, Math.PI*2);
                chartCtx.fill();
            }

            chartCtx.fillStyle = '#888';
            chartCtx.font = '12px sans-serif';
            chartCtx.textAlign = 'center';
            chartCtx.fillText('Fire Size (log)', W/2, H-10);
        }

        function updateStats() {
            let treeCount = 0;
            for (let i = 0; i < grid.length; i++) if (grid[i] === TREE) treeCount++;
            document.getElementById('step').textContent = step;
            document.getElementById('trees').textContent = treeCount;
            document.getElementById('density').textContent = ((treeCount / grid.length) * 100).toFixed(1);
            document.getElementById('fires').textContent = fireSizes.length;
            document.getElementById('largest').textContent = largestFire;
            document.getElementById('fps').textContent = fps;
        }

        // ===== ANIMATION LOOP =====
        // Main loop: step simulation at specified rate, render, update stats
        function animate(ts) {
            frameCount++;
            if (ts - lastFpsTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsTime = ts;
            }
            if (!paused) {
                const spf = Math.max(1, Math.floor(stepsPerSecond / 60));  // Steps per frame
                for (let i = 0; i < spf; i++) simulationStep();
                render();
                if (step % 5 === 0) renderChart();
                updateStats();
            }
            requestAnimationFrame(animate);
        }

        // ===== EVENT LISTENERS =====
        // Handle user controls
        document.getElementById('speed').addEventListener('input', e => {
            stepsPerSecond = parseInt(e.target.value);
            document.getElementById('speedVal').textContent = stepsPerSecond;
        });
        // Changing grid size requires full reinitialization
        document.getElementById('size').addEventListener('input', e => {
            GRID_SIZE = parseInt(e.target.value);
            document.getElementById('sizeVal').textContent = GRID_SIZE;
            glCanvas.width = GRID_SIZE;
            glCanvas.height = GRID_SIZE;
            initGrid();
            render();
        });
        document.getElementById('growth').addEventListener('input', e => {
            treeGrowth = parseInt(e.target.value) / 100;
            document.getElementById('growthVal').textContent = e.target.value;
        });
        document.getElementById('lightning').addEventListener('input', e => {
            lightning = parseInt(e.target.value) / 100000;
            document.getElementById('lightningVal').textContent = (parseInt(e.target.value)/100).toFixed(2);
        });
        document.getElementById('strike').addEventListener('click', lightningStrike);
        document.getElementById('reset').addEventListener('click', () => {
            initGrid();
            render();
            renderChart();
            updateStats();
        });
        document.getElementById('pause').addEventListener('click', e => {
            paused = !paused;
            e.target.textContent = paused ? 'Start' : 'Pause';
        });

        // ===== INITIALIZATION =====
        initGrid();
        render();
        updateStats();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
