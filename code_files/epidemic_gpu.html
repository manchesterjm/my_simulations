<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epidemic Simulation (GPU)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; color: #e63946; }
        .subtitle { color: #888; margin-bottom: 20px; text-align: center; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { border: 2px solid #333; background: #000; }
        .chart-container { display: flex; flex-direction: column; align-items: center; }
        .chart-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .controls { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        label { font-size: 12px; color: #888; }
        input[type="range"] { width: 120px; }
        button { background: #e63946; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: #f25c69; }
        .stats { margin-top: 15px; font-size: 14px; color: #aaa; }
        .legend { display: flex; gap: 20px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; }
        .susceptible { color: #457b9d; }
        .infected { color: #e63946; }
        .recovered { color: #2a9d8f; }
        .dead { color: #666; }
        .gpu-badge { background: #4CAF50; color: white; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>SIRD Epidemic Simulation <span class="gpu-badge">WebGL GPU</span></h1>
    <p class="subtitle">GPU-Accelerated with Spatial Hashing - Handles 100k+ agents</p>

    <div class="container">
        <div class="chart-container">
            <canvas id="glCanvas"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: #457b9d;"></div><span>Susceptible</span></div>
                <div class="legend-item"><div class="legend-color" style="background: #e63946;"></div><span>Infected</span></div>
                <div class="legend-item"><div class="legend-color" style="background: #2a9d8f;"></div><span>Recovered</span></div>
                <div class="legend-item"><div class="legend-color" style="background: #1a1a1a; border: 1px solid #444;"></div><span>Dead</span></div>
            </div>
        </div>
        <div class="chart-container">
            <div class="chart-title">Population Over Time</div>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <div class="stats">
        Day: <span id="day">0</span> |
        <span class="susceptible">S: <span id="susceptible">0</span></span> |
        <span class="infected">I: <span id="infected">0</span></span> |
        <span class="recovered">R: <span id="recovered">0</span></span> |
        <span class="dead">D: <span id="dead">0</span></span> |
        FPS: <span id="fps">0</span>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Speed: <span id="speedVal">60</span> steps/sec</label>
            <input type="range" id="speed" min="1" max="500" value="60">
        </div>
        <div class="control-group">
            <label>Infection Rate: <span id="infectionVal">5</span>%</label>
            <input type="range" id="infection" min="1" max="30" value="5">
        </div>
        <div class="control-group">
            <label>Recovery Days: <span id="recoveryVal">14</span></label>
            <input type="range" id="recovery" min="3" max="30" value="14">
        </div>
        <div class="control-group">
            <label>Mortality: <span id="mortalityVal">2</span>%</label>
            <input type="range" id="mortality" min="0" max="50" value="2">
        </div>
        <div class="control-group">
            <label>Population: <span id="popVal">10000</span></label>
            <input type="range" id="population" min="1000" max="100000" step="1000" value="10000">
        </div>
        <div class="control-group">
            <label>Inject %: <span id="injectVal">20</span>%</label>
            <input type="range" id="injectPercent" min="1" max="100" value="20">
        </div>
        <button id="inject" style="background: #9d4edd;">Inject</button>
        <button id="reset">Reset</button>
        <button id="pause">Start</button>
    </div>

    <script>
        // Constants
        const SUSCEPTIBLE = 0, INFECTED = 1, RECOVERED = 2, DEAD = 3;
        const WORLD_SIZE = 700;
        const CHART_WIDTH = 400, CHART_HEIGHT = 300;
        const INFECTION_RADIUS = 12;
        const CELL_SIZE = INFECTION_RADIUS; // For spatial hashing

        // WebGL setup
        const glCanvas = document.getElementById('glCanvas');
        glCanvas.width = WORLD_SIZE;
        glCanvas.height = WORLD_SIZE;
        const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');

        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');
        chartCanvas.width = CHART_WIDTH;
        chartCanvas.height = CHART_HEIGHT;

        // Shader sources
        const vertexShaderSource = `
            attribute vec2 a_position;
            attribute float a_state;
            uniform vec2 u_resolution;
            uniform float u_pointSize;
            varying float v_state;
            void main() {
                vec2 clipSpace = (a_position / u_resolution) * 2.0 - 1.0;
                gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
                gl_PointSize = u_pointSize;
                v_state = a_state;
            }
        `;

        const fragmentShaderSource = `
            precision mediump float;
            varying float v_state;
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;

                vec3 color;
                if (v_state < 0.5) color = vec3(0.27, 0.48, 0.62);      // Susceptible
                else if (v_state < 1.5) color = vec3(0.90, 0.22, 0.27); // Infected
                else if (v_state < 2.5) color = vec3(0.16, 0.62, 0.56); // Recovered
                else color = vec3(0.1, 0.1, 0.1);                        // Dead

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Compile shaders
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        // Get attribute/uniform locations
        const positionLoc = gl.getAttribLocation(program, 'a_position');
        const stateLoc = gl.getAttribLocation(program, 'a_state');
        const resolutionLoc = gl.getUniformLocation(program, 'u_resolution');
        const pointSizeLoc = gl.getUniformLocation(program, 'u_pointSize');

        // Create buffers
        const positionBuffer = gl.createBuffer();
        const stateBuffer = gl.createBuffer();

        // Simulation state
        let positions, velocities, states, daysInfected;
        let day = 0;
        let history = { susceptible: [], infected: [], recovered: [], dead: [] };
        let totalInfections = 0;
        let paused = true;
        let stepsPerSecond = 60;
        let lastFpsTime = 0, frameCount = 0, currentFps = 0;

        // Parameters
        let populationSize = 10000;
        let infectionProb = 0.05;
        let recoveryDays = 14;
        let mortalityRate = 0.02;
        let injectPercent = 0.20;

        // Spatial hash grid
        let grid = {};
        const gridCols = Math.ceil(WORLD_SIZE / CELL_SIZE);

        function hashKey(x, y) {
            const cx = Math.floor(x / CELL_SIZE);
            const cy = Math.floor(y / CELL_SIZE);
            return cy * gridCols + cx;
        }

        function buildSpatialHash() {
            grid = {};
            for (let i = 0; i < populationSize; i++) {
                if (states[i] === DEAD) continue;
                const key = hashKey(positions[i * 2], positions[i * 2 + 1]);
                if (!grid[key]) grid[key] = [];
                grid[key].push(i);
            }
        }

        function getNearbyCells(x, y) {
            const cx = Math.floor(x / CELL_SIZE);
            const cy = Math.floor(y / CELL_SIZE);
            const nearby = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const key = (cy + dy) * gridCols + (cx + dx);
                    if (grid[key]) nearby.push(...grid[key]);
                }
            }
            return nearby;
        }

        function initSimulation() {
            positions = new Float32Array(populationSize * 2);
            velocities = new Float32Array(populationSize * 2);
            states = new Float32Array(populationSize);
            daysInfected = new Uint16Array(populationSize);

            for (let i = 0; i < populationSize; i++) {
                positions[i * 2] = Math.random() * WORLD_SIZE;
                positions[i * 2 + 1] = Math.random() * WORLD_SIZE;
                velocities[i * 2] = (Math.random() - 0.5) * 3;
                velocities[i * 2 + 1] = (Math.random() - 0.5) * 3;
                states[i] = SUSCEPTIBLE;
                daysInfected[i] = 0;
            }

            // Initial infections
            // Start with no infections - user can inject manually

            day = 0;
            history = { susceptible: [], infected: [], recovered: [], dead: [] };
            totalInfections = 0;
        }

        function simulationStep() {
            // Build spatial hash
            buildSpatialHash();

            // Move agents
            for (let i = 0; i < populationSize; i++) {
                if (states[i] === DEAD) continue;

                // Add random movement
                velocities[i * 2] += (Math.random() - 0.5) * 0.3;
                velocities[i * 2 + 1] += (Math.random() - 0.5) * 0.3;

                // Limit speed
                const vx = velocities[i * 2];
                const vy = velocities[i * 2 + 1];
                const speed = Math.sqrt(vx * vx + vy * vy);
                if (speed > 2) {
                    velocities[i * 2] = (vx / speed) * 2;
                    velocities[i * 2 + 1] = (vy / speed) * 2;
                }

                // Update position
                positions[i * 2] += velocities[i * 2];
                positions[i * 2 + 1] += velocities[i * 2 + 1];

                // Bounce off walls
                if (positions[i * 2] < 0) { positions[i * 2] = 0; velocities[i * 2] *= -1; }
                if (positions[i * 2] > WORLD_SIZE) { positions[i * 2] = WORLD_SIZE; velocities[i * 2] *= -1; }
                if (positions[i * 2 + 1] < 0) { positions[i * 2 + 1] = 0; velocities[i * 2 + 1] *= -1; }
                if (positions[i * 2 + 1] > WORLD_SIZE) { positions[i * 2 + 1] = WORLD_SIZE; velocities[i * 2 + 1] *= -1; }
            }

            // Check infections using spatial hash
            for (let i = 0; i < populationSize; i++) {
                if (states[i] !== INFECTED) continue;

                const x = positions[i * 2];
                const y = positions[i * 2 + 1];
                const nearby = getNearbyCells(x, y);

                for (const j of nearby) {
                    if (states[j] !== SUSCEPTIBLE) continue;

                    const dx = positions[j * 2] - x;
                    const dy = positions[j * 2 + 1] - y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < INFECTION_RADIUS * INFECTION_RADIUS && Math.random() < infectionProb) {
                        states[j] = INFECTED;
                        totalInfections++;
                    }
                }
            }

            // Update infected agents
            for (let i = 0; i < populationSize; i++) {
                if (states[i] === INFECTED) {
                    daysInfected[i]++;
                    if (daysInfected[i] >= recoveryDays) {
                        if (Math.random() < mortalityRate) {
                            states[i] = DEAD;
                            velocities[i * 2] = 0;
                            velocities[i * 2 + 1] = 0;
                        } else {
                            states[i] = RECOVERED;
                        }
                    }
                }
            }

            day++;

            // Record history
            const counts = countStates();
            history.susceptible.push(counts.susceptible);
            history.infected.push(counts.infected);
            history.recovered.push(counts.recovered);
            history.dead.push(counts.dead);

            if (history.susceptible.length > 500) {
                history.susceptible.shift();
                history.infected.shift();
                history.recovered.shift();
                history.dead.shift();
            }
        }

        function countStates() {
            let susceptible = 0, infected = 0, recovered = 0, dead = 0;
            for (let i = 0; i < populationSize; i++) {
                if (states[i] === SUSCEPTIBLE) susceptible++;
                else if (states[i] === INFECTED) infected++;
                else if (states[i] === RECOVERED) recovered++;
                else dead++;
            }
            return { susceptible, infected, recovered, dead };
        }

        function render() {
            // Clear
            gl.viewport(0, 0, WORLD_SIZE, WORLD_SIZE);
            gl.clearColor(0.04, 0.04, 0.08, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Update position buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(positionLoc);
            gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

            // Update state buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, stateBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, states, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(stateLoc);
            gl.vertexAttribPointer(stateLoc, 1, gl.FLOAT, false, 0, 0);

            // Set uniforms
            gl.uniform2f(resolutionLoc, WORLD_SIZE, WORLD_SIZE);
            const pointSize = Math.max(1, Math.min(4, 20000 / populationSize));
            gl.uniform1f(pointSizeLoc, pointSize);

            // Draw
            gl.drawArrays(gl.POINTS, 0, populationSize);
        }

        function renderChart() {
            chartCtx.fillStyle = '#0a0a15';
            chartCtx.fillRect(0, 0, CHART_WIDTH, CHART_HEIGHT);

            if (history.susceptible.length < 2) return;

            const padding = 40;
            const chartW = CHART_WIDTH - padding * 2;
            const chartH = CHART_HEIGHT - padding * 2;
            const len = history.susceptible.length;
            const maxVal = populationSize;

            // Axes
            chartCtx.strokeStyle = '#444';
            chartCtx.lineWidth = 1;
            chartCtx.beginPath();
            chartCtx.moveTo(padding, padding);
            chartCtx.lineTo(padding, CHART_HEIGHT - padding);
            chartCtx.lineTo(CHART_WIDTH - padding, CHART_HEIGHT - padding);
            chartCtx.stroke();

            function drawLine(data, color) {
                chartCtx.strokeStyle = color;
                chartCtx.lineWidth = 2;
                chartCtx.beginPath();
                for (let i = 0; i < data.length; i++) {
                    const x = padding + (i / (len - 1 || 1)) * chartW;
                    const y = CHART_HEIGHT - padding - (data[i] / maxVal) * chartH;
                    if (i === 0) chartCtx.moveTo(x, y);
                    else chartCtx.lineTo(x, y);
                }
                chartCtx.stroke();
            }

            drawLine(history.susceptible, '#457b9d');
            drawLine(history.infected, '#e63946');
            drawLine(history.recovered, '#2a9d8f');
            drawLine(history.dead, '#333');
        }

        function updateStats() {
            const counts = countStates();
            document.getElementById('day').textContent = day;
            document.getElementById('susceptible').textContent = counts.susceptible;
            document.getElementById('infected').textContent = counts.infected;
            document.getElementById('recovered').textContent = counts.recovered;
            document.getElementById('dead').textContent = counts.dead;
            document.getElementById('fps').textContent = currentFps;
        }

        let lastTime = 0;
        function animate(timestamp) {
            // FPS calculation
            frameCount++;
            if (timestamp - lastFpsTime >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsTime = timestamp;
            }

            if (!paused) {
                const stepsPerFrame = Math.max(1, Math.floor(stepsPerSecond / 60));
                for (let i = 0; i < stepsPerFrame; i++) {
                    simulationStep();
                }
                render();
                if (day % 3 === 0) renderChart();
                updateStats();
            }
            requestAnimationFrame(animate);
        }

        // Event listeners
        document.getElementById('speed').addEventListener('input', (e) => {
            stepsPerSecond = parseInt(e.target.value);
            document.getElementById('speedVal').textContent = stepsPerSecond;
        });

        document.getElementById('infection').addEventListener('input', (e) => {
            infectionProb = parseInt(e.target.value) / 100;
            document.getElementById('infectionVal').textContent = e.target.value;
        });

        document.getElementById('recovery').addEventListener('input', (e) => {
            recoveryDays = parseInt(e.target.value);
            document.getElementById('recoveryVal').textContent = e.target.value;
        });

        document.getElementById('mortality').addEventListener('input', (e) => {
            mortalityRate = parseInt(e.target.value) / 100;
            document.getElementById('mortalityVal').textContent = e.target.value;
        });

        document.getElementById('population').addEventListener('input', (e) => {
            populationSize = parseInt(e.target.value);
            document.getElementById('popVal').textContent = e.target.value;
        });

        document.getElementById('injectPercent').addEventListener('input', (e) => {
            injectPercent = parseInt(e.target.value) / 100;
            document.getElementById('injectVal').textContent = e.target.value;
        });

        document.getElementById('inject').addEventListener('click', () => {
            // Count susceptible AND recovered (can re-infect recovered)
            const n = states.length;
            let targetIndices = [];
            for (let i = 0; i < n; i++) {
                if (states[i] < 0.5 || (states[i] > 1.5 && states[i] < 2.5)) {
                    // SUSCEPTIBLE (0) or RECOVERED (2)
                    targetIndices.push(i);
                }
            }
            const pct = parseInt(document.getElementById('injectPercent').value) / 100;
            const numToInfect = Math.max(1, Math.floor(targetIndices.length * pct));
            // Randomly pick agents to infect
            let infected = 0;
            for (let k = 0; k < numToInfect; k++) {
                if (targetIndices.length === 0) break;
                const idx = Math.floor(Math.random() * targetIndices.length);
                const agentIdx = targetIndices[idx];
                states[agentIdx] = INFECTED;
                daysInfected[agentIdx] = 0;
                totalInfections++;
                targetIndices.splice(idx, 1);
                infected++;
            }
            console.log('Injected', infected, 'new infections');
        });

        document.getElementById('reset').addEventListener('click', () => {
            initSimulation();
            render();
            renderChart();
            updateStats();
        });

        document.getElementById('pause').addEventListener('click', (e) => {
            paused = !paused;
            e.target.textContent = paused ? 'Start' : 'Pause';
        });

        // Start
        initSimulation();
        render();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
